<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Daily log preview</title>
  <desc id="desc">A dark daily learning log page layout.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#071827"/>
      <stop offset="100%" stop-color="#0d1d2f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a2b3d"/>
      <stop offset="100%" stop-color="#101d2f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#43b9ff"/>
      <stop offset="100%" stop-color="#7a7efc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="60" y="50" width="1080" height="660" rx="18" fill="url(#panel)" stroke="#2f4568"/>
  <rect x="90" y="82" width="1040" height="50" rx="12" fill="#0f1d2d"/>
  <circle cx="122" cy="107" r="8" fill="#ff5f57"/>
  <circle cx="148" cy="107" r="8" fill="#ffbd2e"/>
  <circle cx="174" cy="107" r="8" fill="#28c840"/>
  <text x="240" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#dfeaf8">Milan Josipović</text>
  <rect x="760" y="92" width="170" height="28" rx="14" fill="#1a314d"/>
  <text x="815" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#dfeaf8">Projects</text>

  <text x="150" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#a8bdd5">Day 01 of 100</text>
  <text x="150" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#edf5ff">Semantic HTML5</text>
  <rect x="150" y="286" width="170" height="42" rx="10" fill="url(#accent)"/>
  <text x="185" y="313" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#f9fbff" font-weight="700">View Source</text>
  <rect x="336" y="286" width="162" height="42" rx="10" fill="#1b2d40" stroke="#3d5d80"/>
  <text x="367" y="313" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#dfeaf8" font-weight="700">Live Demo</text>

  <text x="150" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#f4f8ff">What I Built Today</text>
  <text x="150" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#cfe0f4">Describe the code structure, features, or drills you tackled.</text>

  <text x="150" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#f4f8ff">Key Concepts &amp; Takeaways</text>
  <circle cx="172" cy="560" r="6" fill="#59c2ff"/>
  <text x="190" y="567" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#dfeaf8">Concept 1: Brief explanation of a technical pattern or rule.</text>
  <circle cx="172" cy="606" r="6" fill="#59c2ff"/>
  <text x="190" y="613" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#dfeaf8">Concept 2: Realization or debugging breakthrough.</text>

  <text x="150" y="682" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#9bb0c8">First Day</text>
  <text x="1020" y="682" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#9bb0c8">Next Day</text>
